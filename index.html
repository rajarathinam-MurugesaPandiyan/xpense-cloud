<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Xpense Cloud - Smart Financial Management for Android, iOS & Web</title>
    <meta name="description" content="Xpense Cloud is the ultimate smart expense tracker. Sync expenses across Android, iOS, and Web with real-time analytics, AI insights, and bank-grade security." />
    
    <!-- GitHub Pages Single Page App Redirect Restore Script (rafgraph/spa-github-pages) -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <!-- Google Fonts: Poppins (Primary UI) & Inter (Data/Numeric Figures) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Anti-FOUC Theme Detection Script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('xpense-theme') || 'system';
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = stored === 'dark' || (stored === 'system' && systemDark);
          const resolved = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          const metaScheme = document.querySelector('meta[name="color-scheme"]');
          if (metaScheme) metaScheme.content = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
